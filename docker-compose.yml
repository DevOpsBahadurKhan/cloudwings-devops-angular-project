version: '3.8'

services:
  web:
    build: .
    container_name: web
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - my_network

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - my_network

networks:
  my_network:
    driver: bridge
